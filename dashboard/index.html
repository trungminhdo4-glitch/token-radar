<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar · pre-token protocols ranked by implied launch value</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="11"/><circle cx="20" cy="20" r="4"/><path d="M20 20 L35 9"/></svg>
    <div>
      <h1>Token Radar</h1>
      <p class="sub">Protocols whose DefiLlama record shows no token, ranked by what that record implies a launch is worth</p>
    </div>
  </div>
  <div class="stamp" id="stamp"></div>
</header>
<section class="kpis" id="kpis" aria-label="Board summary"></section>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="board">Launch board</button>
  <button role="tab" data-tab="live">Trading comparables</button>
  <button role="tab" data-tab="parked">Parked products</button>
  <button role="tab" data-tab="model">Value model</button>
</nav>
<main id="view" tabindex="-1"></main>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="scrim" id="scrim"></div>
<script src="../data.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
